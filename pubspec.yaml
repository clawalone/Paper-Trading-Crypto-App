name: stock_arena
description: A gamified paper-trading Flutter app with virtual stocks, charts, missions, badges, and leaderboards.
publish_to: "none"

version: 1.0.30+31

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.1
  fl_chart: ^1.2.0
  google_fonts: ^8.1.0
  intl: ^0.20.2
  shared_preferences: ^2.5.5
  firebase_core: ^4.10.0
  firebase_auth: ^6.5.2
  yahoo_finance_data_reader: ^1.0.14
  syncfusion_flutter_charts: ^33.2.10
  google_sign_in: 6.2.1
  cloud_firestore: ^6.5.0
  web_socket_channel: ^3.0.3
  http: ^1.6.0
  url_launcher: ^6.3.2
  animated_list_plus: ^0.5.2
  in_app_purchase: ^3.2.0
  package_info_plus: ^10.2.1
  webview_flutter: ^4.14.1
  in_app_review: ^2.0.12
  flutter_local_notifications: ^22.3.3
  firebase_messaging: ^16.7.1
  googleapis_auth: ^2.3.5
  google_mobile_ads: ^9.2.0
  local_auth: ^3.0.2
  crypto: ^3.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/avatars/
    - assets/icon.png

flutter_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon.png"

